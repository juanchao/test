site_name: My Obsidian Docs
theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 关于: about.md

plugins:
  - search
  - ezlinks:
      wikilinks: true
      # 如果需要支持 ![[embed]] 可以加这一行，默认通常开启
      # embedded_media: true 
